name: Update contribution chart

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download contribution data
        env:
          CONTRIBUTIONS_TOKEN: ${{ secrets.CONTRIBUTIONS_TOKEN }}
        run: |
          query='query($login:String!) { user(login:$login) { contributionsCollection { contributionCalendar { totalContributions weeks { contributionDays { contributionCount date } } } } } }'
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $CONTRIBUTIONS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -nc --arg query "$query" --arg login "aduseimedia-eng" '{query:$query,variables:{login:$login}}')" \
            https://api.github.com/graphql \
            | jq '.data.user.contributionsCollection.contributionCalendar' \
            > data/github-contributions.json
      - name: Commit refreshed chart data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/github-contributions.json
          git diff --cached --quiet || git commit -m "chore: refresh contribution chart"
          git push
